# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Lean proofs of Grothendieck's archives (Montpellier notes and Buffalo lectures)"
  description: >-
    Lean 4 proofs of statements read in two archives of Alexandre Grothendieck: the working notes
    kept at the University of Montpellier, in the modernised readings of the edition
    grothendieck-project and of the paper « Grothendieck Montpellier. Énoncés des lectures
    modernisées démontrés. » (Hexagon 2611.00125), and the lectures given at Buffalo in 1973. The
    library covers algebraic geometry, commutative algebra, category and topos theory, homotopy
    theory, combinatorics and geometry, built on Mathlib and on AxiomMath's Stacks Project in
    Lean. The compared Challenge has 41 statements, from 31 folders of the notes and from
    problem 3 of the Buffalo lectures, each written with Mathlib alone.
  authors:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"

classification:
  arxiv: ["math.AG", "math.CT", "math.AC", "math.CO", "math.HO"]
  msc2020: ["03B35", "14-03", "18-03", "52C30", "01A60"]

sources:
  - title: "Grothendieck Montpellier. Énoncés des lectures modernisées démontrés."
    authors:
      - "Michel Hua"
    id: "https://hexagonmath.org/2611.00125v2"
    type: "preprint"
    location: "https://hexagonmath.org/2611.00125v2"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Working notes of Alexandre Grothendieck (University of Montpellier)"
    authors:
      - "Alexandre Grothendieck"
    id: "https://grothendieck.umontpellier.fr/"
    type: "manuscript"
    location: "https://grothendieck.umontpellier.fr/"
    relationship: "independently-proves"
    note: "The folders state the results; the proofs are the paper's. Each section of Challenge.lean gives the folder and the page of its statements."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    The library holds the Lean proofs of the paper, one file per folder of the working notes in
    topic directories (Grothendieck/), the entries of the Buffalo lectures (Buffalo/), the open
    problems of both stated as definitions (OpenProblems/), and the general lemmas they use
    (LeanPool/). The Challenge (Challenge.lean) states 41 of its theorems with Mathlib alone;
    Solution proves the same statements through the library. Every build fails on any warning,
    hence on any sorry outside Challenge.lean, and checks that every constant uses only the three
    standard axioms.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "Claude Code with the Lean language server, on Lean 4, Mathlib and AxiomMath's Stacks; the proofs were written by the model and checked by Lean."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and cloud sessions"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: "The statements and the proof strategies were set by the author; the Lean text was written by a language model under his direction and kept only once Lean accepted it."

fidelity:
  divergences: "The statements are the modernised readings of the edition, not the manuscripts' words; where a folder speaks of an object Mathlib does not define, the Challenge states the property it uses (the section of Challenge.lean says so)."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The Challenge statements are those of the paper, compared with the readings by the author; no independent mathematical review."

