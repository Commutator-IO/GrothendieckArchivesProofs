name: Kernel check

# Issue #31, question 4 of « …and the proof is checked in Lean »: does the code exploit a bug in
# Lean's kernel? `lake check --paranoid` (Lean v4.35.0) builds the default targets inside a
# `bwrap` sandbox, exports the whole environment (Mathlib, Stacks, the copied files and this
# repository), and replays it through Lean's kernel and every external checker bundled with the
# toolchain: `leanchecker-paranoid`, `lean4lean`, `nanoda`, `con-leche` and `con-ron`. It fails
# if any of them rejects a declaration, or if any axiom other than propext, Classical.choice and
# Quot.sound is used. A soundness bug would have to be shared by all six kernels to go unnoticed.
#
# The export and the six replays of the whole closure take hours, so this runs weekly and by
# hand, not on every push. `runs_on` lets it run on the self-hosted runner of issue #34.

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: 'Runner labels, as JSON (e.g. ["self-hosted","linux","x64","lean"])'
        required: false
        default: '"ubuntu-latest"'
  schedule:
    # Sundays, 02:41 UTC.
    - cron: '41 2 * * 0'
  # A change to this workflow is tested on its pull request.
  pull_request:
    paths:
      - .github/workflows/kernel-check.yml

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Add swap
        if: runner.environment == 'github-hosted'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      # The sandbox of `lake check`. Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, which bwrap needs; lift that restriction on the (throwaway) hosted runner.
      - name: Install bubblewrap
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          fi
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-net true

      # Start from main's build, so that the sandboxed build only replays it.
      - name: Restore .lake
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-kernel-check
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false

      - name: Check with every kernel
        run: |
          set -o pipefail
          lake check --paranoid 2>&1 | tee kernel-check.log

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-check-log
          path: kernel-check.log
          if-no-files-found: ignore
