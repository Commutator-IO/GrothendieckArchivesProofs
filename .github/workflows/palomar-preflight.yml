# Palomar's mechanical preflight (https://github.com/PalomarRegistry/PalomarSubmission): the full
# verification a submission goes through, run on this repository at the dispatched commit, on
# GitHub's hosted runner (profile palomar-standard-v1: 4 cores, 16 GB, 350 min). Advisory only;
# the submission itself goes through https://submit.palomar-registry.org/. Run by hand.
name: Palomar preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
