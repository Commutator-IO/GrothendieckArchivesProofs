name: Build

# Runs on the self-hosted runner of issue #34 (Azure, 32 cores, 128 GB). The compiled `.lake` is
# kept on the machine, one copy per version of `lake-manifest.json` + `lean-toolchain`, under
# $LEAN_CI_STORE (default /var/lib/lean-ci). Every job works on its own copy, so concurrent jobs
# never share a `.lake`; only a successful build of `main` writes the store back. Pull requests,
# including those from forks, only read it. The GitHub-hosted build is kept in
# `build-hosted.yml`, started by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, lean]
    timeout-minutes: 240
    env:
      LEAN_CI_STORE: ${{ vars.LEAN_CI_STORE || '/var/lib/lean-ci' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The store entry for these pins if there is one, otherwise the most recent entry (after a
      # Stacks or Mathlib bump, most of the old build is still valid and Lake rebuilds the rest).
      - name: Restore .lake from the machine
        env:
          PINS: ${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
        run: |
          echo "STORE_ENTRY=$LEAN_CI_STORE/$PINS" >> "$GITHUB_ENV"
          source_dir="$LEAN_CI_STORE/$PINS"
          if [ ! -d "$source_dir" ]; then
            source_dir=$(ls -1td "$LEAN_CI_STORE"/*/ 2>/dev/null | head -n 1 || true)
          fi
          rm -rf .lake
          if [ -n "$source_dir" ] && [ -d "$source_dir" ]; then
            echo "Restoring .lake from $source_dir"
            cp -a --reflink=auto "${source_dir%/}" .lake
          else
            echo "No stored .lake: cold build"
          fi
          df -h . | tail -1

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build --log-level=warning

      # Only main writes the store, after a green build. The new entry is written next to the old
      # one and swapped in under a lock, so a job reading the store never sees a half-written copy.
      - name: Save .lake to the machine
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$LEAN_CI_STORE"
          (
            flock 9
            tmp="$STORE_ENTRY.tmp.$GITHUB_RUN_ID"
            rm -rf "$tmp"
            cp -a --reflink=auto .lake "$tmp"
            rm -rf "$STORE_ENTRY.old"
            if [ -d "$STORE_ENTRY" ]; then mv "$STORE_ENTRY" "$STORE_ENTRY.old"; fi
            mv "$tmp" "$STORE_ENTRY"
            rm -rf "$STORE_ENTRY.old"
            # Keep the three most recent entries.
            ls -1td "$LEAN_CI_STORE"/*/ | grep -v '\.tmp\.' | tail -n +4 | xargs -r rm -rf
          ) 9>"$LEAN_CI_STORE/.lock"
          du -sh "$STORE_ENTRY"

      - name: Remove the job's .lake
        if: always()
        run: rm -rf .lake
