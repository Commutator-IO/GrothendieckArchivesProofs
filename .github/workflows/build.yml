name: Build

# Runs on the self-hosted runner of issue #34 (Azure, 16 cores, 64 GB). The compiled `.lake` is
# kept on the machine, one copy per version of `lake-manifest.json` + `lean-toolchain`, under
# $LEAN_CI_STORE (default /var/lib/lean-ci/store, on the same XFS disk as the job workspaces in
# /var/lib/lean-ci/work, so the copies below are reflinks). Every job works on its own copy, so concurrent jobs
# never share a `.lake`; only a successful build of `main` writes the store back. Pull requests,
# including those from forks, only read it. The GitHub-hosted build is kept in
# `build-hosted.yml`, started by hand.
#
# The runner VM is on demand: it is deallocated when idle (it does that itself after 10 minutes
# without a job) and the `start-runner` job below starts it through OIDC, with an Azure role that
# can only read and start that one VM. The VM, its disk and both roles are Terraform in
# Commutator-IO/ai-infra (stacks/lean-ci); the repository variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, LEAN_CI_RESOURCE_GROUP and LEAN_CI_VM come from
# `terraform output github_variables` there. None of them is a secret.

# Only main builds on its own: with a single runner, a pull request never queues ahead of main. A
# pull request builds when the `ci` label is added to it (remove and add it again to rebuild); a
# `pull_request` event keeps the OIDC identity that may start the VM, which a `workflow_dispatch`
# on a branch other than main does not have.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests from forks receive no OIDC token, so they skip this job; a maintainer approves
  # the run and starts the VM (`az vm start`) if it is down. A `workflow_dispatch` on a branch
  # other than main cannot start it either: the Azure identity trusts main and pull requests only.
  start-runner:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ci' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # A Spot VM can fail to start when Azure has no spare capacity of that size; the error says
      # so, and `build-hosted.yml` is the fallback.
      - name: Start the runner VM
        env:
          RG: ${{ vars.LEAN_CI_RESOURCE_GROUP }}
          VM: ${{ vars.LEAN_CI_VM }}
        run: |
          state=$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code,'PowerState')].code | [0]" -o tsv)
          echo "Power state: $state"
          if [ "$state" != "PowerState/running" ]; then
            az vm start -g "$RG" -n "$VM"
            echo "Started; the runner reconnects to GitHub within a minute or two."
          fi

  build:
    needs: start-runner
    # Also when start-runner was skipped (fork pull request): the job then waits for the runner.
    if: >-
      ${{ !cancelled() && needs.start-runner.result != 'failure' &&
      (github.event_name != 'pull_request' || github.event.label.name == 'ci') }}
    # One run per branch: a new run of a pull request cancels its previous one; runs of main are
    # never cancelled, so that the store is always written. At job level, so that adding another
    # label (a skipped job) cancels nothing.
    concurrency:
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, lean]
    timeout-minutes: 240
    env:
      LEAN_CI_STORE: ${{ vars.LEAN_CI_STORE || '/var/lib/lean-ci/store' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The store entry for these pins if there is one, otherwise the most recent entry (after a
      # Stacks or Mathlib bump, most of the old build is still valid and Lake rebuilds the rest).
      - name: Restore .lake from the machine
        env:
          PINS: ${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
        run: |
          echo "STORE_ENTRY=$LEAN_CI_STORE/$PINS" >> "$GITHUB_ENV"
          source_dir="$LEAN_CI_STORE/$PINS"
          if [ ! -d "$source_dir" ]; then
            source_dir=$(ls -1td "$LEAN_CI_STORE"/*/ 2>/dev/null | head -n 1 || true)
          fi
          rm -rf .lake
          if [ -n "$source_dir" ] && [ -d "$source_dir" ]; then
            echo "Restoring .lake from $source_dir"
            cp -a --reflink=auto "${source_dir%/}" .lake
          else
            echo "No stored .lake: cold build"
          fi
          df -h . | tail -1

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build --log-level=warning

      # The five checks below only read the `.lake` that the Build step left complete, and each
      # runs on a single core, so they run side by side: about 7 minutes instead of 25 one after
      # the other. Lean maps the `.olean` files read-only and shared, so five processes take little
      # more memory than one. Each check's log is printed in its own group once all have finished
      # (failed ones first, expanded by GitHub's annotations); the step fails if any failed.
      #
      # The `.olean*` files (~12 GB) are read once beforehand, in large sequential reads. Without
      # it, five processes fault the same mapped files in small random pieces, the data disk hits
      # its IOPS limit (500 on StandardSSD) and the checks took 25 minutes in parallel, on an idle
      # CPU (measured 2026-11-23). The job's `.lake` is a fresh reflink copy, so the page cache
      # left by the store or by an earlier job does not count: this read takes ~20 s.
      #
      # - axioms (issue #31): every constant of this repository depends only on propext,
      #   Classical.choice and Quot.sound, through Mathlib, Stacks and the copied files (no
      #   sorryAx, no added axiom).
      # - definitions (issue #31, questions 1 and 3): the definitions outside Mathlib that the
      #   statements are written with, the list a human review has to cover; and the theorems of
      #   Grothendieck/, Buffalo/ and OpenProblems/ stated with Mathlib alone, which Challenge.lean can
      #   restate. Both kept as artifacts.
      # - duplicates (issue #39, step 1b): the theorems whose statement Mathlib or the imported
      #   Stacks modules already have, or that follow from a library theorem applied to some of
      #   their hypotheses. Artifact, copy in docs/review/.
      # - sources (issue #39, step 3): the declarations by cote of the Montpellier notes, by entry
      #   of the Buffalo index and by EGA/SGA item, from the attributes of `Grothendieck/Attr.lean`
      #   and Stacks' `@[ega]`/`@[sga]`. Artifact; `docs/review/source-index.md` is refreshed by
      #   hand.
      # - comparator (issue #31, question 3): each statement of Challenge.lean (Mathlib alone,
      #   unproved) is proved with exactly that statement by Solution/, using only the three axioms
      #   (comparator.json). lake comparator sandboxes the build with bubblewrap.
      - name: Run the checks (axioms, definitions, duplicates, sources, comparator)
        run: |
          LIBS="GrothendieckArchivesProofs Grothendieck Buffalo OpenProblems Mordell MMP LeanPool"
          LOGS="$RUNNER_TEMP/checks"
          rm -rf "$LOGS" && mkdir -p "$LOGS"

          start=$SECONDS
          find .lake -name '*.olean*' -print0 | xargs -0 -P 8 -n 200 cat >/dev/null
          echo "Read the .olean files into the page cache in $((SECONDS - start)) s"

          axioms() {
            lake env lean --run scripts/CheckAxioms.lean GrothendieckArchivesProofs $LIBS
          }
          definitions() {
            lake env lean --run scripts/StatementDefs.lean GrothendieckArchivesProofs \
              statement-definitions.md --mathlib-only mathlib-only-statements.md $LIBS
          }
          duplicates() {
            lake env lean --run scripts/FindDuplicates.lean GrothendieckArchivesProofs \
              duplicates.md Grothendieck Buffalo OpenProblems && cat duplicates.md
          }
          sources() {
            lake env lean --run scripts/SourceIndex.lean GrothendieckArchivesProofs \
              source-index.md GrothendieckArchivesProofs Grothendieck Buffalo OpenProblems &&
              cat source-index.md
          }
          comparator() {
            if ! command -v bwrap >/dev/null && sudo -n true 2>/dev/null; then
              sudo apt-get install -y -q bubblewrap
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            fi
            if ! command -v bwrap >/dev/null; then
              echo "::warning title=lake comparator not run::bubblewrap is not installed on this runner and cannot be installed without sudo; install it on the image (issue #31)."
              return 0
            fi
            lake comparator
          }

          checks=(axioms definitions duplicates sources comparator)
          pids=()
          for c in "${checks[@]}"; do
            (
              start=$SECONDS
              if "$c"; then rc=0; else rc=$?; fi
              echo "[$c: exit $rc after $((SECONDS - start)) s]"
              exit "$rc"
            ) >"$LOGS/$c.log" 2>&1 &
            pids+=($!)
          done

          failed="" passed=""
          for i in "${!checks[@]}"; do
            c=${checks[$i]}
            if wait "${pids[$i]}"; then passed="$passed $c"; else failed="$failed $c"; fi
          done
          for c in $failed $passed; do
            echo "::group::$c"
            cat "$LOGS/$c.log"
            echo "::endgroup::"
          done
          for c in $passed $failed; do tail -n 1 "$LOGS/$c.log"; done
          if [ -n "$failed" ]; then
            echo "::error title=Checks failed::$failed (see their groups above)"
            exit 1
          fi

      - name: Upload the list
        uses: actions/upload-artifact@v4
        with:
          name: statement-definitions
          path: |
            statement-definitions.md
            mathlib-only-statements.md

      - name: Upload the duplicates
        uses: actions/upload-artifact@v4
        with:
          name: duplicates
          path: duplicates.md

      - name: Upload the source index
        uses: actions/upload-artifact@v4
        with:
          name: source-index
          path: source-index.md

      # Only main writes the store, after a green build. The new entry is written next to the old
      # one and swapped in under a lock, so a job reading the store never sees a half-written copy.
      - name: Save .lake to the machine
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$LEAN_CI_STORE"
          (
            flock 9
            tmp="$STORE_ENTRY.tmp.$GITHUB_RUN_ID"
            rm -rf "$tmp"
            cp -a --reflink=auto .lake "$tmp"
            rm -rf "$STORE_ENTRY.old"
            if [ -d "$STORE_ENTRY" ]; then mv "$STORE_ENTRY" "$STORE_ENTRY.old"; fi
            mv "$tmp" "$STORE_ENTRY"
            rm -rf "$STORE_ENTRY.old"
            # Keep the three most recent entries.
            ls -1td "$LEAN_CI_STORE"/*/ | grep -v '\.tmp\.' | tail -n +4 | xargs -r rm -rf
          ) 9>"$LEAN_CI_STORE/.lock"
          du -sh "$STORE_ENTRY"

      - name: Remove the job's .lake
        if: always()
        run: rm -rf .lake
