name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The compiled Stacks modules have no public cache: keep `.lake` between runs ourselves, and
      # save it even when the build fails, so that a failing run does not throw them away.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.run_id }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      # Installs elan and the toolchain of lean-toolchain, fetches Mathlib's cache, and runs
      # `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build-args: "--log-level=warning"
      - name: Save .lake
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.run_id }}
