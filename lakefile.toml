name = "GrothendieckArchivesProofs"
version = "0.1.0"
defaultTargets = ["GrothendieckArchivesProofs"]

# A `sorry` is a warning, and a proof with a warning in it proves nothing: the build fails on either.
[leanOptions]
warningAsError = true

# Same Mathlib as the Stacks project (and `lean-toolchain`, Lean v4.35.0).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The Stacks Project in Lean (AxiomMath, Apache-2.0); the proofs import from StacksCore and
# StacksFrontier.
[[require]]
name = "Stacks"
git = "https://github.com/AxiomMath/Stacks"
rev = "f56a316ddf7a930906d88b78d6f9a2668cffd0cf"

# AxiomMath/Mordell (Apache-2.0): abelian varieties and ample sheaves, for Buffalo/AG/Part07. It
# pins Stacks c496df0 and is built here against the Stacks above (same Mathlib and Lean); only the
# modules this repository imports are compiled, with Mordell's own options.
[[require]]
name = "Mordell"
git = "https://github.com/AxiomMath/Mordell"
rev = "82a30cb7857f6e3cfdb1be91f5533c0ccb57d493"

[[lean_lib]]
name = "GrothendieckArchivesProofs"
[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

# The working notes kept at the University of Montpellier: one file per folder (cote), in topic
# directories; the general lemmas they use are in LeanPool/ (below).
[[lean_lib]]
name = "Grothendieck"
[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

# The Buffalo lectures (1973): the entries of the index, one file per part.
[[lean_lib]]
name = "Buffalo"
[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

# Files copied from AxiomMath/MMP at 1f9ade3 (Apache-2.0, listed in NOTICE; one is ported), with
# the options of MMP's own lakefile that affect elaboration. Warnings stay errors, as above.
[[lean_lib]]
name = "MMP"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }

# The open problems of the Montpellier notes and of the Buffalo lectures, stated as `Prop`s
# (definitions, not theorems): one file per section of the edition's two notes on open problems.
[[lean_lib]]
name = "OpenProblems"
[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

# Files that also stand in LeanPool/lean-pool (Apache-2.0, Michel Hua's PRs, listed in NOTICE), at
# lean-pool's paths: ToposTheoreticBridges (classifying topoi of geometric theories, Morita
# equivalence, Boolean and De Morgan presheaf topoi), copied at cb3d7f8 and ported from Lean v4.36
# to v4.35, and the general lemmas of CategoryTheoryToolkit, CommutativeAlgebraToolkit and
# LinearAlgebraCombinatoricsAndAnalysis that the Montpellier proofs use, with the options of
# lean-pool's lakefile that affect elaboration. Warnings stay errors, as above.
[[lean_lib]]
name = "LeanPool"
[lean_lib.leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# Issue #31, question 3. The trusted statements, written with Mathlib (and reviewed Stacks
# definitions) alone and left unproved: a `sorry` is expected here, so warnings are not errors in
# this library, which is not a default target. `Solution` proves the same statements through the
# libraries above; `lake comparator` (`comparator.json`) checks that they match.
[[lean_lib]]
name = "Challenge"
leanOptions = { warningAsError = false }

[[lean_lib]]
name = "Solution"
